# Central configuration for the Shopee video-affiliate automation pipeline.
# Values here are defaults you must review against your own Shopee account,
# device, and network conditions before running unattended.

daily_target: 10 # videos to publish per calendar day

# Products come from a CSV you export by hand via Shopee Affiliate's own
# "Lấy link hàng loạt" (bulk get-link) feature -- automating that admin
# panel with a browser got the account captcha-challenged, so there is no
# scraping here at all. After exporting, move/rename the downloaded file to
# csv_path below (or point csv_path at wherever you save it) before running
# the pipeline. See README "Nguồn sản phẩm (CSV)".
product_source:
  csv_path: "./data/products_export.csv"
  min_sales: 100 # parsed from the CSV's "Doanh thu" column, e.g. "300k+" -> 300000
  max_candidates_per_run: 20

image_search:
  engine: "google_lens"
  search_url: "https://lens.google.com/upload"
  max_results: 10
  headless: false
  selectors:
    file_input: "input[type='file']"
    result_link: ""

tiktok:
  min_views: 50000
  max_candidates: 5
  download_dir: "./data/downloads"
  request_delay_seconds: 2

phone:
  adb_serial: null # null = use the only device attached; set explicitly if you connect more than one
  shopee_app_package: "com.shopee.vn"
  push_dir_on_device: "/sdcard/DCIM/ShopeeAutoUpload"
  # uiautomator2 selectors (resourceId/text/description) for each screen of
  # the ShopVideo posting flow. Discover them with `python -m uiautomator2 dump`
  # or weditor against your own phone/app version — see README.
  ui:
    open_shop_video_entry: {}
    select_video_from_gallery: {}
    caption_input: {}
    attach_product_button: {}
    product_search_input: {}
    product_search_result_item: {}
    publish_button: {}
    my_videos_tab: {}
    latest_video_item: {}
    cart_icon_on_video: {}

state:
  db_path: "./data/state.db"

logging:
  level: "INFO"
  log_dir: "./data/logs"
