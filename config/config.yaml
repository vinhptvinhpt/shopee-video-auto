# Central configuration for the Shopee video-affiliate automation pipeline.
# Values here are defaults you must review against your own Shopee account,
# device, and network conditions before running unattended.

daily_target: 10 # videos to publish per calendar day

shopee_affiliate:
  portal_url: "https://affiliate.shopee.vn/offer/product_pool"
  # Persistent Playwright profile so you only log in to Shopee once by hand;
  # the automation reuses that session on every run.
  browser_profile_dir: "./data/browser_profile"
  headless: false
  # Use your real installed Google Chrome instead of Playwright's bundled
  # "Chrome for Testing" build. Only used when cdp_endpoint below is null.
  channel: "chrome"
  # Recommended: connect to a real Chrome window you launched and logged
  # into by hand, instead of Playwright launching/controlling its own
  # browser from the start. This is what actually avoids Google's
  # "Couldn't sign you in" block -- see README "Google sign-in blocked".
  # Set to e.g. "http://localhost:9222" once you've launched Chrome with
  # --remote-debugging-port=9222 and logged in; leave null to fall back to
  # launch_persistent_context above.
  cdp_endpoint: null
  bestseller_filter:
    min_sales: 100
    category: null
  max_candidates_per_run: 20
  # Real navigation flow, confirmed from the actual portal's DOM (Ant Design
  # app, class names are BEM-style and stable): click the "Bán chạy nhất"
  # tab, then each product card has its own "Lấy link" button right on the
  # list -- no need to open a popup/product page at all. Clicking it opens
  # an Ant Design modal; click "Sao chép Link" inside that modal to reveal
  # the real tracked affiliate link, then close the modal.
  navigation:
    category_link_text: "Hoa hồng Sản phẩm"
    bestseller_tab_text: "Bán chạy nhất"
    get_link_button_text: "Lấy link"
    copy_link_button_text: "Sao chép Link"
    close_popup_button_text: "Close"
  # CSS selectors confirmed from the portal's real DOM (see the ant-design
  # class names below), except product_link_value which still needs
  # calibrating: click "Lấy link" on one product, then DevTools-inspect the
  # element that shows the resulting link text/input inside the modal (see
  # README "Calibrating selectors").
  selectors:
    product_card: ".AffiliateItemCard" # one repeating product card in the bestseller grid
    product_name: ".ItemCard__name"
    product_thumbnail: ".ItemCard__image img"
    sales_count: ".ItemCardSold_wrap" # e.g. "5k+ lượt bán" / "1tr+ lượt bán"
    get_link_button: ".AffiliateItemCard__getlinkBtn" # the in-card "Lấy link" button
    product_link_value: "" # STILL NEEDED: element showing the link inside the "Sao chép Link" modal

image_search:
  engine: "google_lens"
  search_url: "https://lens.google.com/upload"
  max_results: 10
  headless: false
  selectors:
    file_input: "input[type='file']"
    result_link: ""

tiktok:
  min_views: 50000
  max_candidates: 5
  download_dir: "./data/downloads"
  request_delay_seconds: 2

phone:
  adb_serial: null # null = use the only device attached; set explicitly if you connect more than one
  shopee_app_package: "com.shopee.vn"
  push_dir_on_device: "/sdcard/DCIM/ShopeeAutoUpload"
  # uiautomator2 selectors (resourceId/text/description) for each screen of
  # the ShopVideo posting flow. Discover them with `python -m uiautomator2 dump`
  # or weditor against your own phone/app version — see README.
  ui:
    open_shop_video_entry: {}
    select_video_from_gallery: {}
    caption_input: {}
    attach_product_button: {}
    product_search_input: {}
    product_search_result_item: {}
    publish_button: {}
    my_videos_tab: {}
    latest_video_item: {}
    cart_icon_on_video: {}

state:
  db_path: "./data/state.db"

logging:
  level: "INFO"
  log_dir: "./data/logs"
